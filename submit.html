<!-- Overlay header — X / back arrow + centered label -->

</header>

<!-- Main content -->
<main id="app" class="flex-grow w-full max-w-[840px] mx-auto px-margin-mobile md:px-margin-desktop flex flex-col"></main>

<script src="brands.js"></script>
<script>
/* ================================================================
   Submit-a-Review — 10-step overlay flow
   ================================================================
   0  Verify             5  Pricing Stds
   1  Your retailer      6  Shop Local Support
   2  Select brand       7  Shop Floor Support
   3  Expectations       8  Pro Deal Standards
   4  Website Stds       9  Review & submit
                         →  Confirmation (post-submit)
   ================================================================ */

const TOTAL_STEPS = 10;
const DIM_DESCRIPTIONS = {
  website: "How brand.com presents and behaves on its own digital surface.",
  pricing: "MAP enforcement and pricing discipline across the channel beyond brand.com.",
  local:   "Brand actively routing customers to the retailers carrying it.",
  floor:   "Brand investment in the people and the partnership that drive in-store sell-through.",
  pro:     "Discipline on internal discount programs that affect retail customer flow."
};

const CITIES = [
  "Austin, TX","Boulder, CO","Bend, OR","Seattle, WA","Portland, OR",
  "Denver, CO","Salt Lake City, UT","San Francisco, CA","Los Angeles, CA","San Diego, CA",
  "Phoenix, AZ","Tucson, AZ","Flagstaff, AZ","Albuquerque, NM","Santa Fe, NM",
  "New York, NY","Brooklyn, NY","Boston, MA","Chicago, IL","Minneapolis, MN",
  "Madison, WI","Milwaukee, WI","Detroit, MI","Ann Arbor, MI","Indianapolis, IN",
  "Nashville, TN","Asheville, NC","Charlotte, NC","Raleigh, NC","Atlanta, GA",
  "Savannah, GA","Charleston, SC","Miami, FL","Tampa, FL","Orlando, FL","Jacksonville, FL",
  "Philadelphia, PA","Pittsburgh, PA","Washington, DC","Richmond, VA","Charlottesville, VA",
  "Burlington, VT","North Conway, NH","Freeport, ME","Portland, ME",
  "Steamboat Springs, CO","Durango, CO","Telluride, CO","Breckenridge, CO","Vail, CO",
  "Park City, UT","Moab, UT","Jackson, WY","Bozeman, MT","Missoula, MT","Whitefish, MT",
  "Sun Valley, ID","Boise, ID","Spokane, WA","Bellingham, WA",
  "Hood River, OR","Eugene, OR","Ashland, OR","Reno, NV","Tahoe City, CA",
  "Mammoth Lakes, CA","Santa Cruz, CA","Ventura, CA","Santa Barbara, CA",
  "Sacramento, CA","Oakland, CA","San Jose, CA","Fresno, CA",
  "Chattanooga, TN","Knoxville, TN","Memphis, TN",
  "Kansas City, MO","St. Louis, MO","Omaha, NE","Des Moines, IA",
  "Dallas, TX","Houston, TX","San Antonio, TX","Fort Worth, TX","El Paso, TX",
  "Columbus, OH","Cleveland, OH","Cincinnati, OH",
  "Honolulu, HI","Anchorage, AK","Juneau, AK",
  "Auckland, NZ","Wellington, NZ","Christchurch, NZ","Queenstown, NZ",
  "Sydney, NSW","Melbourne, VIC","Brisbane, QLD","Perth, WA",
  "Vancouver, BC","Toronto, ON","Montreal, QC","Calgary, AB","Banff, AB","Whistler, BC",
  "London, UK","Edinburgh, UK","Manchester, UK","Bristol, UK",
  "Chamonix, France","Innsbruck, Austria","Zurich, Switzerland","Munich, Germany"
];

/* ============== STATE ============== */
const S = {
  step: 0,
  verifyMethod: null,
  email: "",
  name: "",
  retailer: null,
  retailerLocation: "",
  brand: null,
  ratings: {}
};

DIMENSIONS.forEach(d => {
  S.ratings[d.key] = { subs: {}, praise: "", improve: "" };
  DIMENSION_SUBS[d.key].forEach(sub => {
    S.ratings[d.key].subs[sub.key] = { stars: 0, comment: "" };
  });
});

const $app    = document.getElementById("app");
const $hdrBtn = document.getElementById("header-btn");
const $hdrIcn = document.getElementById("header-icon");

/* ============== PROGRESS BAR + HEADER ============== */
function getProgressInfo() {
  const step = S.step;
  if (step === 0) return { pct: 0, label: "Verify your identity", count: "" };
  if (step === 1) return { pct: 5, label: "Your retailer", count: "" };
  if (step === 2) return { pct: 10, label: "Select brand", count: "" };
  if (step === 3) return { pct: 15, label: "Overview", count: "" };
  if (step >= 4 && step <= 8) {
    const dimIdx = step - 4;
    const dim = DIMENSIONS[dimIdx];
    const rated = countRated();
    const pct = 15 + ((dimIdx + 1) * 16);
    return { pct: Math.min(95, pct), label: dim.name, count: Math.round((rated / 20) * 100) + "% complete" };
  }
  if (step === 9) return { pct: 95, label: "Review & submit", count: Math.round((countRated() / 20) * 100) + "% complete" };
  return { pct: 100, label: "", count: "" };
}

function countRated() {
  let n = 0;
  DIMENSIONS.forEach(d => {
    DIMENSION_SUBS[d.key].forEach(sub => { if (S.ratings[d.key].subs[sub.key].stars > 0) n++; });
  });
  return n;
}

function updateChrome() {
  const info = getProgressInfo();
  const isConfirm = S.step >= 10;

  document.getElementById("progress-bar").style.display = isConfirm ? "none" : "";
  document.getElementById("progress-fill").style.width = info.pct + "%";
  document.getElementById("progress-label").textContent = info.label;
  document.getElementById("progress-count").textContent = info.count;

  if (S.step === 0 || isConfirm) {
    $hdrIcn.textContent = "close";
    $hdrBtn.onclick = () => { window.location.href = "index.html"; };
  } else {
    $hdrIcn.textContent = "arrow_back";
    $hdrBtn.onclick = () => handleBack();
  }
}

/* ============== NAVIGATION ============== */
let _transitioning = false;

function _animate(fwd, cb) {
  if (_transitioning) return;
  _transitioning = true;
  $app.classList.add(fwd ? "step-exit-fwd" : "step-exit-bwd");
  $app.addEventListener("animationend", function handler() {
    $app.removeEventListener("animationend", handler);
    $app.classList.remove("step-exit-fwd", "step-exit-bwd");
    cb();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
    $app.classList.add(fwd ? "step-enter-fwd" : "step-enter-bwd");
    $app.addEventListener("animationend", function handler2() {
      $app.removeEventListener("animationend", handler2);
      $app.classList.remove("step-enter-fwd", "step-enter-bwd");
      _transitioning = false;
    });
  });
}

function go(n) {
  const next = Math.max(0, Math.min(TOTAL_STEPS - 1, n));
  if (next === S.step) return;
  const fwd = next > S.step;
  _animate(fwd, () => { S.step = next; });
}

function validateDimAndGo(n) {
  const dim = DIMENSIONS[S.step - 4];
  const subs = DIMENSION_SUBS[dim.key];
  for (const sub of subs) {
    if (S.ratings[dim.key].subs[sub.key].stars < 1) {
      showValidationMsg("Please rate all sub-components before continuing.");
      return;
    }
  }
  clearValidationMsg();
  go(n);
}

function showValidationMsg(msg) {
  clearValidationMsg();
  const el = document.getElementById('validation-msg');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}
function clearValidationMsg() {
  const el = document.getElementById('validation-msg');
  if (el) { el.textContent = ''; el.classList.add('hidden'); }
}

function handleBack() {
  go(S.step - 1);
}

/* ============== SCORING ============== */
function dimScore(key) {
  const subs = S.ratings[key].subs;
  let total = 0;
  for (const k of Object.keys(subs)) total += subs[k].stars;
  return total;
}
function totalScore() {
  return DIMENSIONS.reduce((sum, d) => sum + dimScore(d.key), 0);
}
function tierColor20(s) {
  if (s >= 16) return "text-score-high";
  if (s >= 13) return "text-score-mid";
  return "text-score-low";
}

/* ============== STAR RATING ============== */
function heroStarsHtml(dimKey, subKey, current, anchor1, anchor5) {
  let stars = '';
  for (let i = 1; i <= 5; i++) {
    const filled = i <= current;
    stars += `<button type="button" onclick="rateStar('${dimKey}','${subKey}',${i})"
      class="flex-1 flex items-center justify-center transition-colors focus:outline-none py-1 cursor-pointer">
      <span class="material-symbols-outlined ${filled ? 'star-filled text-accent' : 'text-[#94A3B8] hover:text-accent/50'}" style="font-size:36px">star</span>
    </button>`;
  }
  return `<div class="mt-1">
    <div class="flex items-center" data-star-group="${dimKey}_${subKey}">${stars}</div>
    <div class="flex mt-0.5">
      <div class="flex-1 flex flex-col items-center">
        <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-score-low/10 text-score-low font-bold text-xs">1</span>
        <span class="text-xs text-score-low leading-tight whitespace-nowrap">${anchor1}</span>
      </div>
      <div class="flex-1"></div>
      <div class="flex-1"></div>
      <div class="flex-1"></div>
      <div class="flex-1 flex flex-col items-center">
        <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-score-high/10 text-score-high font-bold text-xs">5</span>
        <span class="text-xs text-score-high leading-tight whitespace-nowrap">${anchor5}</span>
      </div>
    </div>
  </div>`;
}

window.rateStar = function(dimKey, subKey, val) {
  S.ratings[dimKey].subs[subKey].stars = val;
  document.querySelectorAll(`[data-star-group="${dimKey}_${subKey}"] button`).forEach((btn, idx) => {
    const filled = (idx + 1) <= val;
    const icon = btn.querySelector('.material-symbols-outlined');
    icon.className = `material-symbols-outlined ${filled ? 'star-filled text-accent' : 'text-[#94A3B8] hover:text-accent/50'}`;
    icon.style.fontSize = '36px';
  });
  const subCard = document.getElementById(`sub-${dimKey}-${subKey}`);
  if (subCard) {
    subCard.classList.toggle('border-l-2', val > 0);
    subCard.classList.toggle('border-accent', val > 0);
  }
  const score = dimScore(dimKey);
  document.querySelectorAll('.dim-score-display').forEach(el => el.textContent = score);
  const countEl = document.getElementById('progress-count');
  if (countEl) countEl.textContent = Math.round((countRated() / 20) * 100) + "% complete";
};

window.autoGrow = function(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
window.savePraise = function(dimKey, val) { S.ratings[dimKey].praise = val; };
window.saveImprove = function(dimKey, val) { S.ratings[dimKey].improve = val; };

/* ============== SHARED UI HELPERS ============== */
function ctaBtn(label, onclick, enabled) {
  const dis = enabled === false;
  return `<button ${dis ? '' : `onclick="${onclick}"`}
    class="w-full py-4 font-body-md text-body-md text-on-primary bg-primary rounded-xl
    ${dis ? 'opacity-30 cursor-not-allowed' : 'hover:opacity-90 active:scale-[0.98]'}
    transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2
    flex justify-center items-center gap-2">${label}</button>`;
}

function centeredIcon(iconName) {
  return `<div class="w-16 h-16 mx-auto mb-8 rounded-xl bg-surface-container flex items-center justify-center">
    <span class="material-symbols-outlined text-primary text-3xl">${iconName}</span>
  </div>`;
}

/* ============== RENDERERS ============== */

function renderVerify() {
  const emailErr = S._emailErr || "";
  const emailVal = S.email ? ` value="${S.email.replace(/"/g, '&quot;')}"` : "";
  const nameVal = S.name ? ` value="${S.name.replace(/"/g, '&quot;')}"` : "";
  const showEmail = S._showEmailForm;

  let content = `
    <div class="flex-grow flex flex-col items-center justify-center text-center py-12">
      ${centeredIcon('verified_user')}
      <h1 class="font-display-lg text-display-lg text-primary mb-4 px-4">Are you a retailer?</h1>
      <p class="font-body-md text-body-md text-text-caption max-w-xs mx-auto mb-8">Reviews on the Index come from verified retailers only. We use LinkedIn to confirm.</p>

      <div class="w-full max-w-sm mx-auto space-y-3">
        <button onclick="S.verifyMethod='linkedin';go(1)"
          class="w-full flex items-center justify-center px-6 py-3 border border-border-hairline bg-surface-card hover:bg-surface-container-low transition-colors rounded-DEFAULT font-data-tabular text-data-tabular text-primary" data-auth="linkedin">
          <svg aria-hidden="true" class="w-5 h-5 mr-3 text-[#0a66c2]" fill="currentColor" viewBox="0 0 24 24">
            <path clip-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" fill-rule="evenodd"></path>
          </svg>
          Continue with LinkedIn
        </button>
        <button onclick="S.verifyMethod='google';go(1)"
          class="w-full flex items-center justify-center px-6 py-3 border border-border-hairline bg-surface-card hover:bg-surface-container-low transition-colors rounded-DEFAULT font-data-tabular text-data-tabular text-primary" data-auth="google">
          <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <div class="flex items-center gap-3 my-1">
          <div class="flex-1 border-t border-border-hairline"></div>
          <span class="font-caption text-caption text-text-caption">or</span>
          <div class="flex-1 border-t border-border-hairline"></div>
        </div>`;

  if (!showEmail) {
    content += `
        <button onclick="S._showEmailForm=true;render()"
          class="w-full flex items-center justify-center px-6 py-3 border border-border-hairline bg-surface-card hover:bg-surface-container-low transition-colors rounded-DEFAULT font-data-tabular text-data-tabular text-primary">
          <span class="material-symbols-outlined text-lg mr-3">mail</span>
          Continue with Email
        </button>
        <p class="font-caption text-caption text-text-caption text-center">We don\u2019t post anything. We only confirm you work in retail.</p>
      </div>`;
  } else {
    content += `
        <div class="space-y-3 text-left">
          <div>
            <label class="sr-only" for="verify-email">Work Email</label>
            <input id="verify-email" type="email"${emailVal} placeholder="you@yourretailer.com"
              oninput="S.email=this.value;S._emailErr=''"
              class="w-full px-4 py-3 bg-surface-card border ${emailErr ? 'border-error' : 'border-border-hairline'} rounded-DEFAULT font-body-md text-body-md text-text-main placeholder:text-text-caption focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors">
            ${emailErr ? `<p class="font-caption text-caption text-error mt-1">${emailErr}</p>` : ''}
          </div>
          <div>
            <label class="sr-only" for="verify-name">Your name (optional)</label>
            <input id="verify-name" type="text"${nameVal} placeholder="Your name (optional)"
              oninput="S.name=this.value"
              class="w-full px-4 py-3 bg-surface-card border border-border-hairline rounded-DEFAULT font-body-md text-body-md text-text-main placeholder:text-text-caption focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors">
          </div>
          <button onclick="handleEmailVerify()"
            class="w-full flex items-center justify-center px-6 py-3 border border-border-hairline bg-surface-card hover:bg-surface-container-low transition-colors rounded-DEFAULT font-data-tabular text-data-tabular text-primary">
            Continue with Email
          </button>
        </div>
        <p class="font-caption text-caption text-text-caption text-center mt-3">We don\u2019t post anything. We only confirm you work in retail.</p>
      </div>`;
  }

  content += `</div>`;
  return content;
}

window.handleEmailVerify = function() {
  const result = validateWorkEmail(S.email);
  if (!result.ok) { S._emailErr = result.reason; render(); return; }
  S._emailErr = "";
  S.verifyMethod = "email";
  go(1);
};

function renderRetailer() {
  const locVal = S.retailerLocation ? ` value="${S.retailerLocation.replace(/"/g, '&quot;')}"` : "";
  const storeVal = S.retailer ? ` value="${S.retailer.name.replace(/"/g, '&quot;')}"` : "";
  const canContinue = S.retailer && S.retailer.name.trim() && S.retailerLocation.trim();
  return `
    <div class="flex-grow flex flex-col py-12">
      <div class="text-center mb-10">
        ${centeredIcon('storefront')}
        <h1 class="font-display-lg text-display-lg text-primary mb-3 px-4">Which retailer do you work for?</h1>
        <p class="font-body-md text-body-md text-text-caption max-w-xs mx-auto">We\u2019ll show your store name on the review.</p>
      </div>

      <div class="space-y-5 mb-auto">
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-xl">storefront</span>
          <input id="retailer-input" type="text" placeholder="Your store name"${storeVal}
            oninput="if(!S.retailer)S.retailer={name:'',domain:''};S.retailer.name=this.value;updateRetailerCta()"
            class="w-full border border-border-hairline rounded-xl pl-12 pr-4 py-3.5 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent">
        </div>

        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-xl">location_on</span>
          <input id="retailer-location" type="text" placeholder="City, State"${locVal}
            oninput="handleCityInput(this.value)" autocomplete="off"
            class="w-full border border-border-hairline rounded-xl pl-12 pr-4 py-3.5 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent">
          <div id="city-dropdown" class="hidden absolute z-40 left-0 right-0 mt-1 bg-surface-card border border-border-hairline rounded-xl shadow-lg max-h-60 overflow-y-auto"></div>
        </div>
      </div>

      <div class="pt-8">
        ${ctaBtn('Continue <span class="material-symbols-outlined text-sm">arrow_forward</span>', "go(" + (S.step + 1) + ")", canContinue)}
      </div>
    </div>`;
}

function renderBrand() {
  const selected = S.brand;
  const inIndex = selected && BRANDS.some(b => b.domain === selected.domain);
  const showManual = S._showManualBrand;

  let manualSection = '';
  if (!selected && !showManual) {
    manualSection = `
      <p class="text-center mt-4">
        <button type="button" onclick="S._showManualBrand=true;render()" class="font-caption text-caption text-link-endvr hover:underline">
          Can\u2019t find your brand? Enter it manually
        </button>
      </p>`;
  } else if (!selected && showManual) {
    const manualName = S._manualBrandName || "";
    const manualDomain = S._manualBrandDomain || "";
    manualSection = `
      <div class="mt-6 space-y-4 border border-border-hairline rounded-xl p-5">
        <p class="font-body-md text-body-md font-semibold text-primary">Enter brand details</p>
        <div>
          <label class="block font-caption text-caption text-text-caption mb-1.5">Brand name <span class="text-error">*</span></label>
          <input id="manual-brand-name" type="text" placeholder="Brand name" value="${manualName.replace(/"/g, '&quot;')}"
            oninput="S._manualBrandName=this.value"
            class="w-full border border-border-hairline rounded-xl px-4 py-3 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent">
        </div>
        <div>
          <label class="block font-caption text-caption text-text-caption mb-1.5">Brand website <span class="text-outline">(optional)</span></label>
          <input id="manual-brand-domain" type="text" placeholder="e.g. brandname.com" value="${manualDomain.replace(/"/g, '&quot;')}"
            oninput="S._manualBrandDomain=this.value"
            class="w-full border border-border-hairline rounded-xl px-4 py-3 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent">
        </div>
        <button type="button" onclick="applyManualBrand()"
          class="w-full py-3 font-body-md text-body-md text-primary border border-border-hairline rounded-xl hover:bg-surface-container transition-colors">
          Use this brand
        </button>
      </div>`;
  }

  return `
    <div class="flex-grow flex flex-col py-12">
      <div class="text-center mb-10">
        ${centeredIcon('search')}
        <h1 class="font-display-lg text-display-lg text-primary mb-3 px-4">Which brand are you reviewing?</h1>
        <p class="font-body-md text-body-md text-text-caption max-w-xs mx-auto">Search by name. We\u2019ll match it to the right company.</p>
      </div>

      <div class="mb-auto">
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-xl">search</span>
          <input id="brand-input" type="text" placeholder="Brand name\u2026"
            ${selected ? `value="${selected.name.replace(/"/g, '&quot;')}"` : ""}
            class="w-full border border-border-hairline rounded-xl pl-12 pr-10 py-3.5 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent">
          ${selected ? `<button onclick="S.brand=null;S._showManualBrand=false;render()" class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg hover:text-primary transition-colors">close</button>` : ''}
          <span id="brand-status" class="hidden absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-text-caption animate-spin text-lg">progress_activity</span>
          <div id="brand-dropdown" class="hidden absolute z-40 left-0 right-0 mt-1 bg-surface-card border border-border-hairline rounded-xl shadow-lg max-h-60 overflow-y-auto"></div>
        </div>

        ${manualSection}

        ${selected ? `
        <div class="text-center py-8">
          <p class="font-headline-md text-headline-md text-primary mb-1">${selected.name}</p>
          <p class="font-caption text-caption text-text-caption mb-3">${selected.domain || ''}</p>
          ${inIndex ? '<span class="inline-flex items-center gap-1 font-caption text-caption text-score-high"><span class="material-symbols-outlined text-sm">check_circle</span> IN INDEX</span>' : '<span class="inline-flex items-center gap-1 font-caption text-caption text-text-caption"><span class="material-symbols-outlined text-sm">add_circle</span> New to Index</span>'}
        </div>` : ''}
      </div>

      <div class="pt-8">
        ${ctaBtn('Continue <span class="material-symbols-outlined text-sm">arrow_forward</span>', "go(" + (S.step + 1) + ")", !!selected)}
      </div>
    </div>`;
}

window.applyManualBrand = function() {
  const name = (S._manualBrandName || "").trim();
  if (!name) return;
  const domain = (S._manualBrandDomain || "").trim();
  S.brand = { name: name, domain: domain };
  S._showManualBrand = false;
  render();
};

function renderExpectations() {
  const brandName = S.brand ? S.brand.name : "this brand";
  return `
    <div class="flex-grow flex flex-col py-12">
      <div class="text-center mb-10">
        ${centeredIcon('checklist')}
        <h1 class="font-display-lg text-display-lg text-primary mb-4 px-4">Here\u2019s what to expect</h1>
        <p class="font-body-md text-body-md text-text-caption max-w-sm mx-auto">
          You\u2019ll rate <strong class="text-primary">${brandName}</strong> across 5 partnership standards, with 4 questions each \u2014 20 ratings total.
        </p>
      </div>

      <div class="space-y-4 mb-auto">
        ${DIMENSIONS.map((dim, i) => {
          const icon = DIMENSION_ICONS[dim.key];
          const desc = DIM_DESCRIPTIONS[dim.key];
          return `
          <div class="flex items-start gap-4">
            <div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0 mt-0.5">
              <span class="font-data-tabular text-data-tabular text-primary">${i + 1}</span>
            </div>
            <div>
              <p class="font-body-md text-body-md font-semibold text-primary">${dim.name}</p>
              <p class="font-caption text-caption text-text-caption">${desc}</p>
            </div>
          </div>`;
        }).join("")}

        <div class="flex items-center gap-4 pt-4">
          <div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-primary" style="font-size:18px">schedule</span>
          </div>
          <p class="font-body-md text-body-md text-text-caption">About 3 minutes to complete</p>
        </div>

        <p class="font-caption text-caption text-text-caption pt-2 pl-12">
          Each question uses a 1\u20135 star rating. You can add optional comments to give the brand specific, actionable feedback.
        </p>
      </div>

      <div class="pt-8">
        ${ctaBtn('Continue <span class="material-symbols-outlined text-sm">arrow_forward</span>', "go(" + (S.step + 1) + ")", true)}
      </div>
    </div>`;
}

function renderDimension(dimIdx) {
  const dim = DIMENSIONS[dimIdx];
  const subs = DIMENSION_SUBS[dim.key];
  const icon = DIMENSION_ICONS[dim.key];
  const score = dimScore(dim.key);
  const nextLabel = dimIdx < 4 ? DIMENSIONS[dimIdx + 1].name : "Review & Submit";
  const r = S.ratings[dim.key];
  const brandName = S.brand ? S.brand.name : "this brand";

  const subsHtml = subs.map((sub, i) => {
    const sr = r.subs[sub.key];
    const rated = sr.stars > 0;
    return `
      <div class="bg-surface-container-low rounded-lg p-4 mb-2 ${rated ? 'border-l-2 border-accent' : ''}" id="sub-${dim.key}-${sub.key}">
        <p class="font-body-md text-body-md font-semibold text-primary">${sub.label}</p>
        <p class="font-caption text-caption text-on-surface-variant">${sub.desc}</p>
        ${heroStarsHtml(dim.key, sub.key, sr.stars, sub.anchor1, sub.anchor5)}
      </div>`;
  }).join('');

  return `
    <div class="flex-grow flex flex-col py-1">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size:22px">${icon}</span>
          <h2 class="font-headline-sm text-headline-sm text-primary">${dim.name}</h2>
        </div>
        <div class="flex items-baseline gap-1">
          <span class="font-headline-sm text-headline-sm text-primary"><span class="dim-score-display">${score}</span></span>
          <span class="font-body-md text-body-md text-text-caption">/ 20</span>
        </div>
      </div>

      ${subsHtml}

      <div class="mt-2 space-y-1.5">
        <div>
          <label class="block font-caption text-caption font-semibold text-primary mb-1">What does ${brandName} do well in ${dim.name}?</label>
          <textarea oninput="savePraise('${dim.key}',this.value);autoGrow(this)" onfocus="autoGrow(this)" rows="2"
            placeholder="e.g., Their website is clean with no permanent sale sections, and the store finder is easy to use"
            class="w-full border border-border-hairline rounded-lg px-3 py-2 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent resize-none">${r.praise || ''}</textarea>
        </div>
        <div>
          <label class="block font-caption text-caption font-semibold text-primary mb-1">What should ${brandName} improve in ${dim.name}?</label>
          <textarea oninput="saveImprove('${dim.key}',this.value);autoGrow(this)" onfocus="autoGrow(this)" rows="2"
            placeholder="e.g., The 15% popup for new visitors undercuts our in-store experience"
            class="w-full border border-border-hairline rounded-lg px-3 py-2 font-body-md text-body-md text-text-main placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-transparent bg-transparent resize-none">${r.improve || ''}</textarea>
        </div>
      </div>

      <div class="mt-2">
        <p id="validation-msg" class="hidden text-error font-caption text-caption text-center mb-2"></p>
        ${ctaBtn(`Next: ${nextLabel} <span class="material-symbols-outlined text-sm">arrow_forward</span>`, `validateDimAndGo(${S.step + 1})`, true)}
      </div>
    </div>`;
}

function renderReview() {
  const total = totalScore();

  let dimsHtml = DIMENSIONS.map((dim, i) => {
    const subs = DIMENSION_SUBS[dim.key];
    const score = dimScore(dim.key);
    const icon = DIMENSION_ICONS[dim.key];
    const r = S.ratings[dim.key];
    const subsHtml = subs.map(sub => {
      const sr = r.subs[sub.key];
      let starsStr = '';
      for (let s = 1; s <= 5; s++) {
        starsStr += `<span class="material-symbols-outlined ${s <= sr.stars ? 'star-filled text-primary' : 'text-outline'}" style="font-size:14px">star</span>`;
      }
      return `<div class="flex justify-between items-center py-1.5"><span class="font-caption text-caption text-text-main">${sub.label}</span><div class="flex gap-0">${starsStr}</div></div>`;
    }).join("");
    const praiseHtml = r.praise ? `<div class="mt-3 flex items-start gap-2"><span class="material-symbols-outlined text-score-high shrink-0" style="font-size:14px">thumb_up</span><p class="font-caption text-caption text-text-main">${r.praise}</p></div>` : '';
    const improveHtml = r.improve ? `<div class="mt-2 flex items-start gap-2"><span class="material-symbols-outlined text-score-low shrink-0" style="font-size:14px">flag</span><p class="font-caption text-caption text-text-main">${r.improve}</p></div>` : '';
    return `
      <div class="py-5 border-b border-border-hairline last:border-b-0">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary" style="font-size:20px">${icon}</span>
            <span class="font-body-md text-body-md font-semibold text-primary">${dim.name}</span>
          </div>
          <span class="font-body-md text-body-md font-semibold ${tierColor20(score)}">${score}<span class="text-text-caption font-normal">/20</span></span>
        </div>
        ${subsHtml}
        ${praiseHtml}
        ${improveHtml}
        <button onclick="go(${4 + i})" class="mt-2 font-caption text-caption text-link-endvr flex items-center gap-1 hover:opacity-80 transition-opacity">
          <span class="material-symbols-outlined" style="font-size:14px">edit</span> Edit
        </button>
      </div>`;
  }).join("");

  return `
    <div class="flex-grow flex flex-col py-8">
      <div class="text-center mb-8">
        ${centeredIcon('checklist')}
        <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Review & Submit</h1>
        <p class="font-body-md text-body-md text-text-caption max-w-xs mx-auto">Check your ratings below. Tap \u201cEdit\u201d to change any section.</p>
      </div>

      <div class="text-center mb-6 py-6 bg-primary-container rounded-xl">
        <span class="font-label-caps text-label-caps text-on-primary-container uppercase">Overall Score</span>
        <div class="font-display-lg text-display-lg text-on-primary mt-1">${total}<span class="text-on-primary-container">/100</span></div>
        <p class="font-caption text-caption text-on-primary-container mt-2">${S.brand ? S.brand.name : '\u2014'} / by ${S.retailer ? S.retailer.name : '\u2014'}, ${S.retailerLocation || '\u2014'}</p>
      </div>

      <div class="mb-auto">${dimsHtml}</div>

      <div class="pt-8">
        ${ctaBtn('Submit Review <span class="material-symbols-outlined text-sm">send</span>', "submitReview()", true)}
      </div>
    </div>`;
}

window.submitReview = function() {
  if (_transitioning) return;
  _transitioning = true;
  $app.classList.add("step-exit-fwd");
  $app.addEventListener("animationend", function handler() {
    $app.removeEventListener("animationend", handler);
    $app.classList.remove("step-exit-fwd");
    S.step = 10;
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
    $app.classList.add("step-enter-fwd");
    $app.addEventListener("animationend", function handler2() {
      $app.removeEventListener("animationend", handler2);
      $app.classList.remove("step-enter-fwd");
      _transitioning = false;
    });
  });
};

function renderConfirmation() {
  const total = totalScore();
  return `
    <div class="flex-grow flex flex-col items-center justify-center text-center py-16 px-4">
      <div class="w-20 h-20 mx-auto mb-8 rounded-full bg-score-high/10 flex items-center justify-center">
        <span class="material-symbols-outlined text-score-high text-5xl">check_circle</span>
      </div>
      <h1 class="font-display-lg text-display-lg text-primary mb-3">Review Submitted</h1>
      <p class="font-body-md text-body-md text-text-caption mb-1">Thank you for rating <strong class="text-primary">${S.brand ? S.brand.name : 'this brand'}</strong>.</p>
      <p class="font-headline-md text-headline-md text-primary mb-8">Your score: ${total}/100</p>
      <p class="font-caption text-caption text-text-caption max-w-xs mb-10">Your review will be verified and published within 48 hours.</p>
      <div class="w-full max-w-sm space-y-3">
        <a href="index.html" class="block w-full py-4 font-body-md text-body-md text-on-primary bg-primary rounded-xl hover:opacity-90 transition-opacity text-center">
          Back to Leaderboard
        </a>
        ${S.brand ? `<a href="brand.html?brand=${encodeURIComponent(S.brand.name)}" class="block w-full py-4 font-body-md text-body-md text-primary border border-border-hairline rounded-xl hover:bg-surface-container transition-colors text-center">View Brand Profile</a>` : ''}
      </div>
    </div>`;
}

/* ============== CITY AUTOCOMPLETE ============== */
window.handleCityInput = function(val) {
  S.retailerLocation = val;
  updateRetailerCta();
  if (_nominatimTimer) clearTimeout(_nominatimTimer);
  const dropdown = document.getElementById("city-dropdown");
  if (!dropdown) return;
  if (val.trim().length < 2) { dropdown.classList.add("hidden"); return; }
  _nominatimTimer = setTimeout(async () => {
    const results = await searchNominatim(val);
    if (!results.length) { dropdown.classList.add("hidden"); return; }
    dropdown.innerHTML = results.map((r, i) =>
      `<button type="button" data-city-idx="${i}" class="w-full text-left flex items-center gap-3 px-4 py-3 hover:bg-surface-container-low border-b border-border-hairline last:border-b-0">
        <span class="material-symbols-outlined text-outline text-lg">location_on</span>
        <span class="font-body-md text-body-md text-text-main">${r.display}</span>
      </button>`
    ).join("");
    dropdown.classList.remove("hidden");
    dropdown.querySelectorAll("button[data-city-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const r = results[Number(btn.dataset.cityIdx)];
        S.retailerLocation = r.display;
        const inp = document.getElementById("retailer-location");
        if (inp) inp.value = r.display;
        dropdown.classList.add("hidden");
        updateRetailerCta();
      });
    });
  }, 300);
};

window.updateRetailerCta = function() {
  const hasStore = S.retailer && S.retailer.name.trim();
  const hasCity = S.retailerLocation.trim();
  const btn = $app.querySelector('.pt-8 button');
  if (!btn) return;
  if (hasStore && hasCity) {
    btn.classList.remove('opacity-30', 'cursor-not-allowed');
    btn.setAttribute('onclick', "go(" + (S.step + 1) + ")");
  } else {
    btn.classList.add('opacity-30', 'cursor-not-allowed');
    btn.removeAttribute('onclick');
  }
};

/* ============== MAIN RENDER ============== */
function render() {
  updateChrome();
  const step = S.step;
  if (step === 0) { $app.innerHTML = renderVerify(); return; }
  if (step === 1) { $app.innerHTML = renderRetailer(); wireCityAutocomplete(); return; }
  if (step === 2) { $app.innerHTML = renderBrand(); wireTypeahead("brand"); return; }
  if (step === 3) { $app.innerHTML = renderExpectations(); return; }
  if (step >= 4 && step <= 8) { $app.innerHTML = renderDimension(step - 4); return; }
  if (step === 9) { $app.innerHTML = renderReview(); return; }
  $app.innerHTML = renderConfirmation();
}

function wireCityAutocomplete() {
  const locationInput = document.getElementById("retailer-location");
  const dropdown = document.getElementById("city-dropdown");
  if (!locationInput || !dropdown) return;
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target) && e.target !== locationInput) {
      dropdown.classList.add("hidden");
    }
  });
}

function wireTypeahead(which) {
  const input    = document.getElementById(which + "-input");
  const dropdown = document.getElementById(which + "-dropdown");
  const status   = document.getElementById(which + "-status");
  if (!input || !dropdown) return;
  setupBrandfetchTypeahead({
    input, dropdown, status,
    indexBrands: BRANDS,
    onSelect(r) {
      S.brand = { name: r.name, domain: r.domain };
      render();
    }
  });
}

render();
</script>
</body>
</html>
