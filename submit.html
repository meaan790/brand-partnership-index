<script>
/* ================================================================
   Submit-a-Review — 10-step overlay flow
   ================================================================
   0  Verify             5  Pricing Stds
   1  Your retailer      6  Shop Local Support
   2  Select brand       7  Shop Floor Support
   3  Expectations       8  Pro Deal Standards
   4  Brand.com Stds     9  Review & submit
                         →  Confirmation (post-submit)
   ================================================================ */

const TOTAL_STEPS = 10;
const DIM_DESCRIPTIONS = {
  website: "How brand.com presents and behaves on its own digital surface.",
  pricing: "MAP enforcement and pricing discipline across the channel beyond brand.com.",
  local:   "How brand.com routes customers to the retailers carrying the brand.",
  floor:   "Brand investment in the people and the partnership that drive in-store sell-through.",
  pro:     "Discipline on internal discount programs that affect retail customer flow."
};

const CITIES = [
  "Austin, TX","Boulder, CO","Bend, OR","Seattle, WA","Portland, OR",
  "Denver, CO","Salt Lake City, UT","San Francisco, CA","Los Angeles, CA","San Diego, CA",
  "Phoenix, AZ","Tucson, AZ","Flagstaff, AZ","Albuquerque, NM","Santa Fe, NM",
  "New York, NY","Brooklyn, NY","Boston, MA","Chicago, IL","Minneapolis, MN",
  "Madison, WI","Milwaukee, WI","Detroit, MI","Ann Arbor, MI","Indianapolis, IN",
  "Nashville, TN","Asheville, NC","Charlotte, NC","Raleigh, NC","Atlanta, GA",
  "Savannah, GA","Charleston, SC","Miami, FL","Tampa, FL","Orlando, FL","Jacksonville, FL",
  "Philadelphia, PA","Pittsburgh, PA","Washington, DC","Richmond, VA","Charlottesville, VA",
  "Burlington, VT","North Conway, NH","Freeport, ME","Portland, ME",
  "Steamboat Springs, CO","Durango, CO","Telluride, CO","Breckenridge, CO","Vail, CO",
  "Park City, UT","Moab, UT","Jackson, WY","Bozeman, MT","Missoula, MT","Whitefish, MT",
  "Sun Valley, ID","Boise, ID","Spokane, WA","Bellingham, WA",
  "Hood River, OR","Eugene, OR","Ashland, OR","Reno, NV","Tahoe City, CA",
  "Mammoth Lakes, CA","Santa Cruz, CA","Ventura, CA","Santa Barbara, CA",
  "Sacramento, CA","Oakland, CA","San Jose, CA","Fresno, CA",
  "Chattanooga, TN","Knoxville, TN","Memphis, TN",
  "Kansas City, MO","St. Louis, MO","Omaha, NE","Des Moines, IA",
  "Dallas, TX","Houston, TX","San Antonio, TX","Fort Worth, TX","El Paso, TX",
  "Columbus, OH","Cleveland, OH","Cincinnati, OH",
  "Honolulu, HI","Anchorage, AK","Juneau, AK",
  "Auckland, NZ","Wellington, NZ","Christchurch, NZ","Queenstown, NZ",
  "Sydney, NSW","Melbourne, VIC","Brisbane, QLD","Perth, WA",
  "Vancouver, BC","Toronto, ON","Montreal, QC","Calgary, AB","Banff, AB","Whistler, BC",
  "London, UK","Edinburgh, UK","Manchester, UK","Bristol, UK",
  "Chamonix, France","Innsbruck, Austria","Zurich, Switzerland","Munich, Germany"
];

/* ============== STATE ============== */
const S = {
  step: 0,
  subStep: 0,
  verifyMethod: null,
  email: "",
  name: "",
  retailer: null,
  retailerLocation: "",
  brand: null,
  ratings: {}
};

DIMENSIONS.forEach(d => {
  S.ratings[d.key] = { subs: {}, praise: "", improve: "" };
  DIMENSION_SUBS[d.key].forEach(sub => {
    S.ratings[d.key].subs[sub.key] = { stars: 0, comment: "" };
  });
});

const $app    = document.getElementById("app");
const $hdrBtn = document.getElementById("header-btn");
const $hdrIcn = document.getElementById("header-icon");

/* ============== PROGRESS BAR + HEADER ============== */
function getProgressInfo() {
  const step = S.step;
  if (step === 0) return { pct: 0, label: "Verify your identity", count: "" };
  if (step === 1) return { pct: 5, label: "Your retailer", count: "" };
  if (step === 2) return { pct: 10, label: "Select brand", count: "" };
  if (step === 3) return { pct: 15, label: "Overview", count: "" };
  if (step >= 4 && step <= 8) {
    const dimIdx = step - 4;
    const dim = DIMENSIONS[dimIdx];
    const subIdx = Math.min(S.subStep, SUBS_PER_DIM - 1);
    const rated = countRated();
    const basePct = 15 + (dimIdx * 17);
    const subPct = Math.round((subIdx / SUBS_PER_DIM) * 17);
    return { pct: Math.min(95, basePct + subPct), label: dim.name, count: Math.round((rated / 20) * 100) + "% complete" };
  }
  if (step === 9) return { pct: 95, label: "Review & submit", count: Math.round((countRated() / 20) * 100) + "% complete" };
  return { pct: 100, label: "", count: "" };
}

function countRated() {
  let n = 0;
  DIMENSIONS.forEach(d => {
    DIMENSION_SUBS[d.key].forEach(sub => { if (S.ratings[d.key].subs[sub.key].stars > 0) n++; });
  });
  return n;
}

function updateChrome() {
  const info = getProgressInfo();
  const isConfirm = S.step >= 10;

  document.getElementById("progress-bar").style.display = isConfirm ? "none" : "";
  document.getElementById("progress-fill").style.width = info.pct + "%";
  document.getElementById("progress-label").textContent = info.label;
  document.getElementById("progress-count").textContent = info.count;

  if (S.step === 0 || isConfirm) {
    $hdrIcn.textContent = "close";
    $hdrBtn.onclick = () => { window.location.href = "index.html"; };
  } else {
    $hdrIcn.textContent = "arrow_back";
    $hdrBtn.onclick = () => handleBack();
  }
}

/* ============== NAVIGATION ============== */
let _transitioning = false;

function _animate(fwd, cb) {
  if (_transitioning) return;
  _transitioning = true;
  $app.classList.add(fwd ? "step-exit-fwd" : "step-exit-bwd");
  $app.addEventListener("animationend", function handler() {
    $app.removeEventListener("animationend", handler);
    $app.classList.remove("step-exit-fwd", "step-exit-bwd");
    cb();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
    $app.classList.add(fwd ? "step-enter-fwd" : "step-enter-bwd");
    $app.addEventListener("animationend", function handler2() {
      $app.removeEventListener("animationend", handler2);
      $app.classList.remove("step-enter-fwd", "step-enter-bwd");
      _transitioning = false;
    });
  });
}

function go(n, targetSubStep) {
  const next = Math.max(0, Math.min(TOTAL_STEPS - 1, n));
  if (next === S.step && targetSubStep === undefined) return;
  const fwd = next > S.step || (next === S.step && targetSubStep !== undefined && targetSubStep > S.subStep);
  _animate(fwd, () => {
    S.step = next;
    S.subStep = targetSubStep !== undefined ? targetSubStep : 0;
  });
}

const SUBS_PER_DIM = 4;
const SUB_SUMMARY = SUBS_PER_DIM;

function goSub(n) {
  if (n < 0) {
    const dimIdx = S.step - 4;
    if (dimIdx <= 0) { go(S.step - 1); return; }
    _animate(false, () => { S.step = S.step - 1; S.subStep = SUB_SUMMARY; });
    return;
  }
  if (n > SUB_SUMMARY) {
    go(S.step + 1);
    return;
  }
  const fwd = n > S.subStep;
  _animate(fwd, () => { S.subStep = n; });
}

function validateSubAndGoSub(n) {
  const dim = DIMENSIONS[S.step - 4];
  const subs = DIMENSION_SUBS[dim.key];
  const sub = subs[S.subStep];
  if (S.ratings[dim.key].subs[sub.key].stars < 1) {
    showValidationMsg("Please rate this sub-component before continuing.");
    return;
  }
  clearValidationMsg();
  goSub(n);
}

function validateDimAndGo(n) {
  const dim = DIMENSIONS[S.step - 4];
  const subs = DIMENSION_SUBS[dim.key];
  for (const sub of subs) {
    if (S.ratings[dim.key].subs[sub.key].stars < 1) {
      showValidationMsg("Please rate all sub-components before continuing.");
      return;
    }
  }
  clearValidationMsg();
  go(n);
}

function showValidationMsg(msg) {
  clearValidationMsg();
  const el = document.getElementById('validation-msg');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}
function clearValidationMsg() {
  const el = document.getElementById('validation-msg');
  if (el) { el.textContent = ''; el.classList.add('hidden'); }
}

function handleBack() {
  if (S.step >= 4 && S.step <= 8 && S.subStep > 0) {
    goSub(S.subStep - 1);
  } else if (S.step >= 5 && S.step <= 8 && S.subStep === 0) {
    _animate(false, () => { S.step = S.step - 1; S.subStep = SUB_SUMMARY; });
  } else {
    go(S.step - 1);
  }
}

/* ============== SCORING ============== */
function dimScore(key) {
  const subs = S.ratings[key].subs;
  let total = 0;
  for (const k of Object.keys(subs)) total += subs[k].stars;
  return total;
}
function totalScore() {
  return DIMENSIONS.reduce((sum, d) => sum + dimScore(d.key), 0);
}
function tierColor20(s) {
  if (s >= 16) return "text-score-high";
  if (s >= 13) return "text-score-mid";
  return "text-score-low";
}

/* ============== STAR RATING ============== */
function starsHtml(dimKey, subKey, current) {
  let html = `<div class="flex justify-between items-center max-w-[320px] mx-auto mb-3" data-star-group="${dimKey}_${subKey}">`;
  for (let i = 1; i <= 5; i++) {
    const filled = i <= current;
    html += `<button type="button" onclick="rateStar('${dimKey}','${subKey}',${i})"
      class="w-12 h-12 flex items-center justify-center rounded-full border
      ${filled ? 'border-primary bg-primary' : 'border-border-hairline hover:bg-surface-container'}
      transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
      <span class="material-symbols-outlined ${filled ? 'star-filled text-on-primary' : 'text-outline'}">star</span>
    </button>`;
  }
  html += '</div>';
  html += '<div class="flex justify-between max-w-[320px] mx-auto px-1 text-text-caption font-caption text-caption"><span>Poor</span><span>Excellent</span></div>';
  return html;
}

window.rateStar = function(dimKey, subKey, val) {
  S.ratings[dimKey].subs[subKey].stars = val;
  document.querySelectorAll(`[data-star-group="${dimKey}_${subKey}"] button`).forEach((btn, idx) => {
    const filled = (idx + 1) <= val;
    const icon = btn.querySelector('.material-symbols-outlined');
    if (filled) {
      btn.className = btn.className.replace(/border-border-hairline hover:bg-surface-container/g, 'border-primary bg-primary').replace(/border-border-hairline/g, 'border-primary');
      if (!btn.classList.contains('bg-primary')) btn.classList.add('border-primary', 'bg-primary');
      btn.classList.remove('hover:bg-surface-container');
      icon.className = 'material-symbols-outlined star-filled text-on-primary';
    } else {
      btn.classList.remove('border-primary', 'bg-primary');
      btn.classList.add('border-border-hairline', 'hover:bg-surface-container');
      icon.className = 'material-symbols-outlined text-outline';
    }
  });
  const score = dimScore(dimKey);
  document.querySelectorAll('.dim-score-display').forEach(el => el.textContent = score);
  const countEl = document.getElementById('progress-count');
  if (countEl) countEl.textContent = Math.round((countRated() / 20) * 100) + "% complete";

  const area = document.getElementById('comment-area');
  const ta = document.getElementById('sub-comment');
  if (!area || !ta) return;
  const isLow = val > 0 && val <= 2;
  const dim = DIMENSIONS.find(d => d.key === dimKey);
  const subs = DIMENSION_SUBS[dimKey];
  const sub = subs.find(s => s.key === subKey);
  const promptText = sub ? (sub.prompt || "Why this score?") : "Why this score?";

  let nudge = area.querySelector('.low-score-nudge');
  if (isLow) {
    ta.rows = 3;
    ta.placeholder = "Low scores really help brands improve. " + promptText;
    ta.classList.remove('border-border-hairline', 'bg-transparent');
    ta.classList.add('border-score-low/30', 'bg-score-low/5');
    if (!nudge) {
      nudge = document.createElement('p');
      nudge.className = 'low-score-nudge font-caption text-caption text-score-low mb-2';
      nudge.textContent = 'Brands use low-score feedback to make changes';
      area.insertBefore(nudge, ta);
    }
  } else {
    ta.rows = 2;
    ta.placeholder = promptText;
    ta.classList.remove('border-score-low/30', 'bg-score-low/5');
    ta.classList.add('border-border-hairline', 'bg-transparent');
    if (nudge) nudge.remove();
  }
};

window.saveComment = function(dimKey, subKey, val) { S.ratings[dimKey].subs[subKey].comment = val; };
window.autoGrow = function(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
window.savePraise = function(dimKey, val) { S.ratings[dimKey].praise = val; };
window.saveImprove = function(dimKey, val) { S.ratings[dimKey].improve = val; };

/* ============== SHARED UI HELPERS ============== */
function ctaBtn(label, onclick, enabled) {
  const dis = enabled === false;
  return `<button ${dis ? '' : `onclick="${onclick}"`}
    class="w-full py-4 font-body-md text-body-md text-on-primary bg-primary rounded-xl
    ${dis ? 'opacity-30 cursor-not-allowed' : 'hover:opacity-90 active:scale-[0.98]'}
    transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2
    flex justify-center items-center gap-2">${label}</button>`;
}

function centeredIcon(iconName) {
  return `<div class="w-16 h-16 mx-auto mb-8 rounded-xl bg-surface-container flex items-center justify-center">
    <span class="material-symbols-outlined text-primary text-3xl">${iconName}</span>
  </div>`;
}

/* ============== RENDERERS ============== */

function renderVerify() {
  const emailErr = S._emailErr || "";
  const emailVal = S.email ? ` value="${S.email.replace(/"/g, '&quot;')}"` : "";
  const nameVal = S.name ? ` value="${S.name.replace(/"/g, '&quot;')}"` : "";
  const showEmail = S._showEmailForm;

  let content = `
    <div class="flex-grow flex flex-col items-center justify-center text-center py-12">
      ${centeredIcon('verified_user')}
      <h1 class="font-display-lg text-display-lg text-primary mb-4 px-4">Are you a retailer?</h1>
      <p class="font-body-md text-body-md text-text-caption max-w-xs mx-auto mb-10">Reviews on the Index come from verified retailers only. We use LinkedIn to confirm.</p>

      <div class="w-full max-w-sm mx-auto space-y-4">
        <button onclick="S.verifyMethod='linkedin';go(1)"
          class="w-full py-4 font-body-md text-body-md text-on-primary bg-primary rounded-xl hover:opacity-90 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-3">
          <span class="material-symbols-outlined text-lg">work</span>
          Continue with LinkedIn
        </button>
        <p class="font-caption text-caption text-text-caption">We don\u2019t post anything. We only confirm you work in retail.</p>
      </div>

      <div class="flex items-center gap-4 w-full max-w-sm mx-auto my-8">
        <div class="flex-1 border-t border-border-hairline"></div>
        <span class="font-caption text-caption text-text-caption">or</span>
        <div class="flex-1 border-t border-border-hairline"></div>
      </div>`;

  if (!showEmail) {
    content += `
      <button onclick="S._showEmailForm=true;render()"

function subProgressDots(total, current) {
  let dots = '';
  for (let i = 0; i < total; i++) {
    const active = i === current;
    const done = i < current;
    dots += `<div class="w-2 h-2 rounded-full transition-all ${active ? 'bg-primary scale-125' : done ? 'bg-primary/40' : 'bg-border-hairline'}"></div>`;
  }
  return `<div class="flex justify-center gap-2 items-center">${dots}<span class="ml-2 font-caption text-caption text-text-caption">${current + 1} of ${total}</span></div>`;
}

function renderDimension(dimIdx) {
  const dim = DIMENSIONS[dimIdx];

  const rating = S.ratings[dim.key].subs[sub.key];
  const isLow = rating.stars > 0 && rating.stars <= 2;
  const promptText = sub.prompt || "Why this score?";
  const placeholder = isLow
    ? "Low scores really help brands improve. " + promptText
    : promptText;

  const nextIsLast = ss === SUBS_PER_DIM - 1;
  const nextBtnLabel = nextIsLast ? "Section Summary" : subs[ss + 1].label;

  return `

      </div>

window.submitReview = function() {
  if (_transitioning) return;
  _transitioning = true;
  $app.classList.add("step-exit-fwd");
  $app.addEventListener("animationend", function handler() {
    $app.removeEventListener("animationend", handler);
    $app.classList.remove("step-exit-fwd");
    S.step = 10;
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
    $app.classList.add("step-enter-fwd");
    $app.addEventListener("animationend", function handler2() {
      $app.removeEventListener("animationend", handler2);
      $app.classList.remove("step-enter-fwd");
      _transitioning = false;
    });
  });
};

window.handleCityInput = function(val) {
  S.retailerLocation = val;
  updateRetailerCta();
  if (_nominatimTimer) clearTimeout(_nominatimTimer);
  const dropdown = document.getElementById("city-dropdown");
  if (!dropdown) return;
  if (val.trim().length < 2) { dropdown.classList.add("hidden"); return; }
  _nominatimTimer = setTimeout(async () => {
    const results = await searchNominatim(val);
    if (!results.length) { dropdown.classList.add("hidden"); return; }
    dropdown.innerHTML = results.map((r, i) =>
      `<button type="button" data-city-idx="${i}" class="w-full text-left flex items-center gap-3 px-4 py-3 hover:bg-surface-container-low border-b border-border-hairline last:border-b-0">
        <span class="material-symbols-outlined text-outline text-lg">location_on</span>
        <span class="font-body-md text-body-md text-text-main">${r.display}</span>
      </button>`
    ).join("");
    dropdown.classList.remove("hidden");
    dropdown.querySelectorAll("button[data-city-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const r = results[Number(btn.dataset.cityIdx)];
        S.retailerLocation = r.display;
        const inp = document.getElementById("retailer-location");
        if (inp) inp.value = r.display;
        dropdown.classList.add("hidden");
        updateRetailerCta();
      });
    });
  }, 300);
};

window.updateRetailerCta = function() {
  const hasStore = S.retailer && S.retailer.name.trim();
  const hasCity = S.retailerLocation.trim();
  const btn = $app.querySelector('.pt-8 button');
  if (!btn) return;
  if (hasStore && hasCity) {
    btn.classList.remove('opacity-30', 'cursor-not-allowed');
    btn.setAttribute('onclick', "go(" + (S.step + 1) + ")");
  } else {
    btn.classList.add('opacity-30', 'cursor-not-allowed');
    btn.removeAttribute('onclick');
  }
};

/* ============== MAIN RENDER ============== */
function render() {
  updateChrome();
  const step = S.step;
  if (step === 0) { $app.innerHTML = renderVerify(); return; }
  if (step === 1) { $app.innerHTML = renderRetailer(); wireCityAutocomplete(); return; }
  if (step === 2) { $app.innerHTML = renderBrand(); wireTypeahead("brand"); return; }
  if (step === 3) { $app.innerHTML = renderExpectations(); return; }
  if (step >= 4 && step <= 8) { $app.innerHTML = renderDimension(step - 4); return; }
  if (step === 9) { $app.innerHTML = renderReview(); return; }
  $app.innerHTML = renderConfirmation();
}

function wireCityAutocomplete() {
  const locationInput = document.getElementById("retailer-location");
  const dropdown = document.getElementById("city-dropdown");
  if (!locationInput || !dropdown) return;
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target) && e.target !== locationInput) {
      dropdown.classList.add("hidden");
    }
  });
}

function wireTypeahead(which) {
  const input    = document.getElementById(which + "-input");
  const dropdown = document.getElementById(which + "-dropdown");
  const status   = document.getElementById(which + "-status");
  if (!input || !dropdown) return;
  setupBrandfetchTypeahead({
    input, dropdown, status,
    indexBrands: BRANDS,
    onSelect(r) {
      S.brand = { name: r.name, domain: r.domain };
      render();
    }
  });
}

render();
</script>
</body>
</html>
